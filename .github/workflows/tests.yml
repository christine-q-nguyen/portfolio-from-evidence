name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v
      - name: The published eval still reproduces, miss included
        run: |
          python ledger.py eval > "$RUNNER_TEMP/eval.txt" || true
          cat "$RUNNER_TEMP/eval.txt"
          grep -q "accuracy  6/7" "$RUNNER_TEMP/eval.txt"
          grep -q "weak spot C07: got flagged, gold verified" "$RUNNER_TEMP/eval.txt"
      - name: The job search demo still tells the same story
        run: |
          python ledger.py mine && python ledger.py approve --yes --approver "CI"
          python jobsearch.py resume
          python jobsearch.py fit | tee "$RUNNER_TEMP/fit.txt"
          grep -q "80%  AI Adoption Product Manager" "$RUNNER_TEMP/fit.txt"
          python jobsearch.py digest --all | tee "$RUNNER_TEMP/digest.txt"
          grep -q "Woodgrove Bank: AI Adoption Product Manager" "$RUNNER_TEMP/digest.txt"
